<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event Selfie Booth</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Efecto espejo */
            z-index: 1;
        }
        #ui-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            pointer-events: none;
        }
        /* Pantalla de Registro de Nombres */
        #name-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        #name-screen h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        #name-screen p {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 25px;
        }
        #name-input {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            font-size: 1.2rem;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
        }
        #name-input::placeholder { color: #888; }
        .primary-btn {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 16px 36px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,255,255,0.3);
        }

        .header-text {
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }
        #countdown {
            font-size: 9rem;
            font-weight: 800;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            display: none;
        }
        .bottom-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            pointer-events: auto;
            width: 100%;
        }
        #capture-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.9);
            border: 6px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #restart-btn {
            display: none;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
        #flash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            opacity: 0;
            z-index: 5;
            pointer-events: none;
            transition: opacity 0.3s ease-out;
        }
        #status {
            position: absolute;
            bottom: 140px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        canvas { display: none; }
    </style>
</head>
<body>

    <!-- Pantalla Inicial para ingresar nombres -->
    <div id="name-screen">
        <h2>¡Bienvenidos! 📸</h2>
        <p>Escriban sus nombres para organizar su foto</p>
        <input type="text" id="name-input" placeholder="Ej. María y Juana" autocomplete="off" />
        <button class="primary-btn" id="start-booth-btn">Continuar</button>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="flash"></div>

    <div id="ui-layer">
        <div class="header-text" id="greeting-display">LISTOS</div>
        <div id="countdown">3</div>
        <div id="status">Guardando foto...</div>
        
        <div class="bottom-controls">
            <button id="capture-btn" aria-label="Tomar foto"></button>
            <button id="restart-btn">🔄 Siguiente grupo</button>
        </div>
    </div>

    <script>
        // PEGA AQUÍ LA URL DE TU GOOGLE APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRJaGPUKW3OoKzEH4leg-BZAuBveOTuiG0IxEH0kWM_s0eD5nKj3stxHW8cghahiPYfA/exec";

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btn = document.getElementById('capture-btn');
        const restartBtn = document.getElementById('restart-btn');
        const countdownEl = document.getElementById('countdown');
        const flashEl = document.getElementById('flash');
        const statusEl = document.getElementById('status');
        const nameScreen = document.getElementById('name-screen');
        const nameInput = document.getElementById('name-input');
        const startBoothBtn = document.getElementById('start-booth-btn');
        const greetingDisplay = document.getElementById('greeting-display');

        let visitorNames = "Invitados";

        // Iniciar cámara frontal
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("Error al acceder a la cámara: " + err.message);
            }
        }

        // Al hacer clic en continuar tras poner nombres
        startBoothBtn.addEventListener('click', () => {
            const val = nameInput.value.trim();
            if (val !== "") {
                visitorNames = val;
            } else {
                visitorNames = "Foto_Evento";
            }
            greetingDisplay.textContent = `¡Hola, ${visitorNames}!`;
            nameScreen.style.display = 'none';
        });

        // Permitir presionar "Enter" para continuar
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startBoothBtn.click();
        });

        function showStatus(msg, duration = 3000) {
            statusEl.textContent = msg;
            statusEl.style.opacity = 1;
            setTimeout(() => { statusEl.style.opacity = 0; }, duration);
        }

        // Botón de captura y cuenta regresiva
        btn.addEventListener('click', () => {
            btn.style.display = 'none';
            let count = 3;
            countdownEl.textContent = count;
            countdownEl.style.display = 'block';

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.textContent = count;
                } else {
                    clearInterval(timer);
                    countdownEl.style.display = 'none';
                    takePhoto();
                }
            }, 1000);
        });

        function takePhoto() {
            flashEl.style.opacity = 1;
            setTimeout(() => { flashEl.style.opacity = 0; }, 150);

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = canvas.toDataURL('image/jpeg', 0.85);
            uploadPhoto(imageData);
        }

        async function uploadPhoto(base64Image) {
            showStatus("Guardando foto en la nube...", 5000);
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        image: base64Image, 
                        names: visitorNames 
                    })
                });
                const result = await response.json();
                if (result.status === "success") {
                    showStatus("¡Foto guardada con éxito!", 3000);
                    restartBtn.style.display = 'block'; // Mostrar botón de siguiente grupo
                } else {
                    showStatus("Error al guardar", 3000);
                    btn.style.display = 'block';
                }
            } catch (error) {
                showStatus("Error de conexión", 3000);
                btn.style.display = 'block';
            }
        }

        // Botón de Reiniciar para el siguiente grupo
        restartBtn.addEventListener('click', () => {
            nameInput.value = "";
            restartBtn.style.display = 'none';
            btn.style.display = 'block';
            nameScreen.style.display = 'flex';
            nameInput.focus();
        });

        startCamera();
    </script>
</body>
</html>
